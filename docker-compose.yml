# GemeinsamKI – Start: docker compose up -d --build
services:
  web:
    build: .
    image: gemeinsamki-web:latest
    container_name: gemeinsamki
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    volumes:
      # Konfiguration, Logs und eingegangene Anfragen bleiben auf dem Host erhalten
      - ./data:/var/www/html/data
